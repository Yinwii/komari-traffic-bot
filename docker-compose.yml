# komari-traffic-bot 部署编排（Yinwii fork）
#
# 目录结构（本文件与代码同目录，即仓库克隆目录）：
#   <repo>/docker-compose.yml   ← 本文件
#   <repo>/.env                 ← 密钥配置（git 忽略，不进仓库）
#   <repo>/data/                ← 运行数据/采样/计划（git 忽略）
#
# 设计要点：镜像只提供 Python 运行时与依赖，代码由 `./:/app` 挂载覆盖，
# 因此更新流程 = git pull && docker compose restart，无需重新构建镜像；
# 仅当 requirements.txt 变动时才需要 docker compose pull（换新依赖）。
#
# 服务：
#   bot —— Telegram 命令监听 + 内置推送调度（日/周/月报由 data/report_schedules.json 驱动）
#   web —— Web 管理面板（uvicorn，容器内 8080，宿主机 WEB_PORT）

services:
  bot:
    image: ghcr.io/wirelouis/komari-traffic-bot:latest
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - STAT_TZ=Asia/Shanghai
    volumes:
      - ./data:/data
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/komari_traffic_report.py", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python", "/app/komari_traffic_report.py", "listen"]

  web:
    image: ghcr.io/wirelouis/komari-traffic-bot:latest
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - STAT_TZ=Asia/Shanghai
    volumes:
      - ./data:/data
      - ./:/app
    ports:
      - "${WEB_PORT:-42474}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "web_app:app", "--host", "0.0.0.0", "--port", "8080"]
